[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dual-agent-memory"
version = "0.1.0"
description = "Dual-Agent Memory Architecture: Epistemic Monitor + Pull-Based Retrieval"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
